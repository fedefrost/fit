services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fit}
      POSTGRES_DB: ${POSTGRES_DB:-fit}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fit} -d ${POSTGRES_DB:-fit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fit}:${POSTGRES_PASSWORD:-fit}@db:5432/${POSTGRES_DB:-fit}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # En Docker sobre Windows los cambios del volumen montado no generan eventos de archivo;
      # el sondeo hace que `next dev` recompile al editar el código.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_next:/app/.next

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    environment:
      CI: "true"

volumes:
  db_data:
  backend_node_modules:
  backend_next:
  frontend_node_modules:
